trigger:
  branches:
    include:
    - refs/heads/main
    - refs/heads/release/*

pool:
  vmImage: ubuntu-latest

parameters:
  - name: deployNonProd
    displayName: Deploy to NonProd
    type: boolean
    default: false
  - name: aksUpgradeVersion
    displayName: Guard a non-prod AKS version upgrade
    type: string
    default: none
  - name: aksOverlayMode
    displayName: Non-prod Azure CNI Overlay migration
    type: string
    default: none
    values:
    - none
    - plan
    - apply
  - name: aksPlanOnly
    displayName: Skip Terraform apply
    type: boolean
    default: false

resources:
  repositories:
  - repository: self
  - repository: subplatform
    type: github
    endpoint: 'CodeBuildDeploy-com'
    name: 'CodeBuildDeploy-com/CodeBuildDeploy.Platform.Subscription'

variables:
# Group variables
- group: CodeBuildDeploy-Global

- template: .ado/variables-infrastructure.yml@subplatform

- template: .ado/variables-build.yml@subplatform
- template: variables-env.yml
  parameters:
    isManual: ${{ variables['build.type.manual'] }}
    isRelease: ${{ variables['build.type.release'] }}
    deployNonProd: ${{ parameters.deployNonProd }}

# Versioning
- template: .ado/variables-versioning.yml@subplatform
  parameters:
    buildTypeRelease: ${{ variables['build.type.release'] }}
    majorVersion: 1
    minorVersion: 0

name: $[variables['Build.Number']]

stages:
- stage: Build
  displayName: Build
  jobs:
  - job: Init_Vars
    displayName: Init Vars
    steps:
    - checkout: self
      displayName: 'Checkout Repo'

    - bash: |
        echo "build.type.release = $(build.type.release)"
        echo "SourceVersion = $(Build.SourceVersion)"
        echo "SourceVersion.Short = $(Build.SourceVersion.Short)"
        echo "Build Number = $(Build.Number)"
        echo "Version Assembly = $(Version.Assembly)"
        echo "Version File = $(Version.File)"
        echo "Version Informational = $(Version.Informational)"
        echo "Version Major = $(Version.Major)"
        echo "Version Minor = $(Version.Minor)"
        echo "Version Patch = $(Version.Patch)"
      displayName: Output Version

  - ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
    - job: Tag_Version
      displayName: Tag Version
      dependsOn:
        - Init_Vars
      steps:
      - checkout: self
        displayName: 'Checkout Repo'
        persistCredentials: true

      - script: |
          git tag $(Build.Number)
          git push origin $(Build.Number)
        workingDirectory: $(Build.SourcesDirectory)
        displayName: Tag Version in Git

- ${{ if eq(variables['deploy.nonprod'], 'true') }}:
  - stage: Provision_NonProd
    displayName: Provision NonProd Platform
    dependsOn:
      - Build
    jobs:
    - deployment: Provision_Platform_NonProd
      displayName: Provision NonProd Platform
      environment: NonProd
      strategy:
        runOnce:
          deploy:
            steps:
            - template: .ado/template-terraform.yml@subplatform
              parameters: 
                service_connection: '$(Azure.Subscription.NonProdEnterprise)'
                tenant_id: '$(Azure.TenantId)'
                tfuser_client_id: '$(Azure.Tf.User.ClientId)'
                kubelogin: true
                terraform_work_directory: '$(Build.SourcesDirectory)/terraform'
                tfstate_rg_name: $(Tf.State.NonProdEnterprise.RG)
                tfstate_storage_account_name: $(Tf.State.NonProdEnterprise.SA)
                tfstate_blob_name: $(Tf.State.NonProdEnterprise.Blob)
                tfstate_file_name: 'nonprod'
                spoke_vars_file_name: 'nonprod'
                apply_changes: ${{ and(ne(parameters.aksOverlayMode, 'plan'), ne(parameters.aksPlanOnly, true)) }}
                ${{ if ne(parameters.aksOverlayMode, 'none') }}:
                  additional_command_options: '-var=aks_system_pool_version=1.33.8'
                ${{ else }}:
                  additional_command_options: ''
                ${{ if or(ne(parameters.aksUpgradeVersion, 'none'), ne(parameters.aksOverlayMode, 'none')) }}:
                  before_apply:
                  - bash: |
                      set -euo pipefail
                      terraform show -json main.tfplan |
                        jq -er --arg version "$AKS_UPGRADE_VERSION" --arg overlay "$AKS_OVERLAY_MODE" -f "$(Build.SourcesDirectory)/.ado/check-aks-upgrade.jq"
                    displayName: Verify the saved Terraform plan only changes the approved AKS settings
                    workingDirectory: '$(Build.SourcesDirectory)/terraform'
                    env:
                      AKS_UPGRADE_VERSION: ${{ parameters.aksUpgradeVersion }}
                      AKS_OVERLAY_MODE: ${{ parameters.aksOverlayMode }}
                  - ${{ if and(ne(parameters.aksOverlayMode, 'plan'), ne(parameters.aksPlanOnly, true)) }}:
                    - task: AzureCLI@3
                      displayName: Snapshot non-prod Terraform state
                      inputs:
                        azureSubscription: '$(Azure.Subscription.NonProdEnterprise)'
                        scriptType: bash
                        scriptLocation: inlineScript
                        inlineScript: |
                          set -euo pipefail
                          blob=(--account-name "$STATE_ACCOUNT" --container-name "$STATE_CONTAINER" --name nonprod.tfstate --auth-mode key --only-show-errors)
                          snapshot=$(az storage blob snapshot "${blob[@]}" --query snapshot -o tsv)
                          test -n "$snapshot"
                          size=$(az storage blob show "${blob[@]}" --snapshot "$snapshot" --query properties.contentLength -o tsv)
                          test "$size" -gt 0
                          echo "Verified pre-upgrade non-prod.tfstate snapshot $snapshot"
                      env:
                        STATE_ACCOUNT: $(Tf.State.NonProdEnterprise.SA)
                        STATE_CONTAINER: $(Tf.State.NonProdEnterprise.Blob)
            
  - ${{ if and(eq(variables['deploy.prod'], 'true'), eq(parameters.aksUpgradeVersion, 'none'), eq(parameters.aksOverlayMode, 'none'), ne(parameters.aksPlanOnly, true)) }}:
    - stage: Provision_Prod
      displayName: Provision Prod Platform
      dependsOn:
        - Provision_NonProd
      jobs:
      - deployment: Provision_Platform_Prod
        displayName: Provision Prod Platform
        environment: Prod
        strategy:
          runOnce:
            deploy:
              steps:
              - template: .ado/template-terraform.yml@subplatform
                parameters: 
                  service_connection: '$(Azure.Subscription.ProdPremium)'
                  tenant_id: '$(Azure.TenantId)'
                  tfuser_client_id: '$(Azure.Tf.User.ClientId)'
                  kubelogin: true
                  terraform_work_directory: '$(Build.SourcesDirectory)/terraform'
                  tfstate_rg_name: $(Tf.State.ProdPremium.RG)
                  tfstate_storage_account_name: $(Tf.State.ProdPremium.SA)
                  tfstate_blob_name: $(Tf.State.ProdPremium.Blob)
                  tfstate_file_name: 'prod'
                  spoke_vars_file_name: 'prod'
                  additional_command_options: ''
