apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: codebuilddeploy-dev
spec:
  parentRefs:
    - name: codebuilddeploy-dev
  hostnames:
    - dev.codebuilddeploy.co.uk
    - dev.codebuilddeploy.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/Blog
        - path:
            type: PathPrefix
            value: /swagger/blog
      backendRefs:
        - name: dev-codebuilddeploy-blogs
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /Identity
      backendRefs:
        - name: dev-codebuilddeploy-identity
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: dev-codebuilddeploy-web
          port: 80
